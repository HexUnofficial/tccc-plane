<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F40000">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="./assets/icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./assets/icons/icon-180.png">
  <title>TCCC — page not found</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #fff;
      background: #F40000;
      -webkit-text-size-adjust: 100%;
    }
    body { display: grid; place-items: center; padding: 1.5rem; overflow: hidden; }

    /* The same two diagonal bands as the aircraft's tow banner. */
    #ribbon { position: fixed; inset: 0; width: 100%; height: 100%; }

    .card { position: relative; max-width: 22rem; text-align: center; }
    .card img { display: block; width: 100%; max-width: 17rem; height: auto; margin-inline: auto;
      filter: drop-shadow(0 3px 10px rgb(0 0 0 / 0.35)); }
    h1 { margin: 1.5rem 0 0.5rem; font-size: 1.25rem; }
    p { margin: 0 0 1.5rem; font-size: 0.9rem; line-height: 1.5; opacity: 0.85; }
    a {
      display: inline-block;
      padding: 0.8rem 1.6rem;
      border-radius: 999px;
      background: #fff;
      color: #F40000;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      box-shadow: 0 8px 20px rgb(0 0 0 / 0.25);
    }
  </style>
</head>

<body>
  <svg id="ribbon" viewBox="0 0 400 400" preserveAspectRatio="none" aria-hidden="true">
    <path d="M-20 130 L420 20 L420 90 L-20 200 Z" fill="rgba(255,255,255,0.14)"/>
    <path d="M-20 260 L420 160 L420 210 L-20 310 Z" fill="rgba(0,0,0,0.18)"/>
  </svg>

  <div class="card">
    <img src="./assets/brand/title.svg" alt="next stop, SHANGHAI!" width="1405" height="538">
    <h1>Nothing at this address</h1>
    <p>That link doesn't lead anywhere. The experience lives at the front page.</p>
    <a href="/">Take me there</a>
  </div>
</body>

</html>
